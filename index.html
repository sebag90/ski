    <style>
      :root {
        --bg: #f6f8fa;
        --card: #ffffff;
        --line: #d0d7de;
        --ink: #1f2328;
        --dim: #656d76;
        --accent: #0969da;
        --pin: #cc5a97;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font:
          15px/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      #map {
        position: absolute;
        inset: 0;
      }

      header {
        position: absolute;
        z-index: 500;
        top: 14px;
        left: 14px;
        padding: 10px 16px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(6px);
      }

      header h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: 0.3px;
      }

      header p {
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--dim);
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(31, 35, 40, 0.25);
      }

      .leaflet-popup-content {
        margin: 14px 16px;
        width: 280px !important;
      }

      .leaflet-popup-close-button {
        color: var(--dim) !important;
      }

      .p-name {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 2px;
      }

      .p-note {
        font-size: 12px;
        color: var(--dim);
        margin: 0 0 10px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0;
        border-top: 1px solid var(--line);
      }

      .row a,
      .p-note a {
        color: var(--accent);
        text-decoration: none;
      }

      .row a:hover {
        text-decoration: underline;
      }

      .price {
        color: #1a7f37;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .total {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 2px solid var(--line);
        display: flex;
        justify-content: space-between;
        font-weight: 600;
      }

      .dim {
        color: var(--dim);
        white-space: nowrap;
      }

      /* Google Maps directions button */
      .directions {
        display: block;
        width: 100%;
        padding: 8px 10px;
        background: var(--accent);
        color: #fff !important;
        text-align: center;
        border-radius: 7px;
        font-weight: 600;
        text-decoration: none !important;
      }

      .directions:hover {
        opacity: 0.9;
        text-decoration: none !important;
      }

      /* Round skier markers, centered on the coordinate,
			price pill underneath */
      .pin {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        box-shadow:
          0 0 0 3px var(--pin),
          0 3px 10px rgba(31, 35, 40, 0.35);
        transition: transform 0.14s ease-out;
      }

      .cap {
        position: absolute;
        top: calc(100% + 4px);
        left: 50%;
        transform: translateX(-50%);
        background: var(--pin);
        color: #fff;
        font-size: 13.5px;
        font-weight: 700;
        line-height: 1;
        padding: 5px 9px;
        border-radius: 999px;
        white-space: nowrap;
        box-shadow:
          0 1px 5px rgba(31, 35, 40, 0.35),
          0 0 0 2px rgba(255, 255, 255, 0.95);
      }

      .leaflet-marker-icon:hover {
        z-index: 600 !important;
      }

      .leaflet-marker-icon:hover .pin {
        transform: scale(1.12);
      }
    </style>
  </head>

																																										MAP
																																										------------------------------------------------------- */

        scrollWheelZoom: true,
      });

      /* -------------------------------------------------------
																																											BASE MAPS
																																											------------------------------------------------------- */

      const base = {
        OpenStreetMap: L.tileLayer(
          "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19,
          },
        ).addTo(map),

        "Terrain (OpenTopoMap)": L.tileLayer(
          "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
          {
            attribution:
              '&copy; OpenStreetMap, SRTM | &copy; <a href="https://opentopomap.org">OpenTopoMap</a>',
            maxZoom: 17,
          },
        ),
      };

      /* -------------------------------------------------------
																																												SKI PISTES / LIFTS
																																												------------------------------------------------------- */

      const pistes = L.tileLayer(
        "https://tiles.opensnowmap.org/pistes/{z}/{x}/{y}.png",
        {
          attribution:
            '&copy; <a href="https://www.opensnowmap.org">OpenSnowMap</a>',
          maxZoom: 18,
          opacity: 0.9,
        },
      ).addTo(map);

      L.control
        .layers(
          base,
          {
            "Pistes & lifts": pistes,
          },
          {
            collapsed: false,
          },
        )
        .addTo(map);

      /* -------------------------------------------------------
																																													LINKS INSIDE POPUPS
																																													------------------------------------------------------- */

      const link = (item) => {
        if (!item.url) {
          return `<span>${item.label}</span>`;
        }

        return `
																																														<a
																																														href="${item.url}"
																																														target="_blank"
																																														rel="noopener"
																																														>
																																														${item.label} ↗
																																														</a>
																																														`;
      };

      /* -------------------------------------------------------
																																														GOOGLE MAPS DIRECTIONS
																																														Opens Google Maps with the ski resort as destination.
																																														The user can choose/change their starting point.
																																														------------------------------------------------------- */

      const directionsLink = (option) => {
        const [lat, lng] = option.coords;

        const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

        return `
																																															<a
																																															class="directions"
																																															href="${url}"
																																															target="_blank"
																																															rel="noopener"
																																															>
																																															🚗 Get directions in Google Maps ↗
																																															</a>
																																															`;
      };

      /* -------------------------------------------------------
																																															POPUP
																																															------------------------------------------------------- */

      const popup = (option) => `
																																															<p class="p-name">${option.name}</p>
																																															
																																															<p class="p-note">
																																															${option.note}
																																															</p>
																																															
																																															${option.items
                                                                                                .map(
                                                                                                  (
                                                                                                    item,
                                                                                                  ) => `
																																															<div class="row">
																																															${link(item)}
																																															<span class="price">
																																															${item.price ? item.price + " €" : ""}
																																															</span>
																																															</div>
																																															`,
                                                                                                )
                                                                                                .join(
                                                                                                  "",
                                                                                                )}
																																															
																																															<div class="row">
																																															${directionsLink(option)}
																																															</div>
																																															
																																															<div class="total">
																																															<span>Cheapest total / person</span>
																																															<span class="price">
																																															~${option.total} €
																																															</span>
																																															</div>
																																															`;

      /* -------------------------------------------------------
																																															MARKERS
																																															------------------------------------------------------- */

      const S = 44;

      const markers = OPTIONS.map((option) =>
        L.marker(option.coords, {
          icon: L.divIcon({
            className: "",
            iconSize: [S, S],
            iconAnchor: [S / 2, S / 2],
            popupAnchor: [0, -S / 2 - 2],

            html: `
																																																	<div class="pin">
																																																	⛷️
																																																	<span class="cap">
																																																	${option.total}€
																																																	</span>
																																																	</div>
																																																	`,
          }),

          title: option.name,
        })
          .bindPopup(popup(option))
          .addTo(map),
      );

      /* -------------------------------------------------------
																																																	FIT MAP TO ALL MARKERS
																																																	------------------------------------------------------- */

      map.fitBounds(L.featureGroup(markers).getBounds().pad(0.25));
    </script>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ski Vacation Options & Weather</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230969da'/%3E%3Cpath d='M6 50 26 16 40 40 47 29 58 50Z' fill='%23fff'/%3E%3Cpath d='M20 26h12l-6-10zM43 35h8l-4-6z' fill='%23bcd8f7'/%3E%3C/svg%3E"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      :root {
        --bg: #f6f8fa;
        --card: #ffffff;
        --line: #d0d7de;
        --ink: #1f2328;
        --dim: #656d76;
        --accent: #0969da;
        --pin: #cc5a97;
        --weather-pin: #0284c7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font:
          15px/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      #map {
        position: absolute;
        inset: 0;
      }

      header {
        position: absolute;
        z-index: 500;
        top: 14px;
        left: 14px;
        padding: 10px 16px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      header h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: 0.3px;
      }

      header p {
        margin: 3px 0 0;
        font-size: 12px;
        color: var(--dim);
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(31, 35, 40, 0.25);
      }

      .leaflet-popup-content {
        margin: 14px 16px;
        width: 300px !important;
      }

      .leaflet-popup-close-button {
        color: var(--dim) !important;
      }

      .p-name {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 2px;
      }

      .p-note {
        font-size: 12px;
        color: var(--dim);
        margin: 0 0 10px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0;
        border-top: 1px solid var(--line);
        align-items: center;
      }

      .row a,
      .p-note a {
        color: var(--accent);
        text-decoration: none;
      }

      .row a:hover {
        text-decoration: underline;
      }

      .price {
        color: #1a7f37;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .total {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 2px solid var(--line);
        display: flex;
        justify-content: space-between;
        font-weight: 600;
      }

      .dim {
        color: var(--dim);
        white-space: nowrap;
      }

      /* Google Maps directions button */
      .directions {
        display: block;
        width: 100%;
        padding: 8px 10px;
        background: var(--accent);
        color: #fff !important;
        text-align: center;
        border-radius: 7px;
        font-weight: 600;
        text-decoration: none !important;
        font-size: 13px;
      }

      .directions:hover {
        opacity: 0.9;
        text-decoration: none !important;
      }

      /* Skier Resort Pin */
      .pin {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        box-shadow:
          0 0 0 3px var(--pin),
          0 3px 10px rgba(31, 35, 40, 0.35);
        transition: transform 0.14s ease-out;
      }

      .cap {
        position: absolute;
        top: calc(100% + 4px);
        left: 50%;
        transform: translateX(-50%);
        background: var(--pin);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 999px;
        white-space: nowrap;
        box-shadow:
          0 1px 5px rgba(31, 35, 40, 0.35),
          0 0 0 2px rgba(255, 255, 255, 0.95);
      }

      /* Weather Station Pin */
      .pin-weather {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #f0f9ff;
        display: grid;
        place-items: center;
        font-size: 23px;
        line-height: 1;
        cursor: pointer;
        box-shadow:
          0 0 0 3px var(--weather-pin),
          0 3px 12px rgba(2, 132, 199, 0.45);
        transition: transform 0.14s ease-out;
      }

      .cap-weather {
        position: absolute;
        top: calc(100% + 4px);
        left: 50%;
        transform: translateX(-50%);
        background: var(--weather-pin);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 999px;
        white-space: nowrap;
        box-shadow:
          0 1px 5px rgba(2, 132, 199, 0.4),
          0 0 0 2px rgba(255, 255, 255, 0.95);
      }

      .leaflet-marker-icon:hover {
        z-index: 600 !important;
      }

      .leaflet-marker-icon:hover .pin,
      .leaflet-marker-icon:hover .pin-weather {
        transform: scale(1.15);
      }

      /* Weather Popup Form */
      .weather-popup {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .weather-tag {
        display: inline-block;
        background: #e0f2fe;
        color: #0369a1;
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .resorts-served {
        font-size: 12px;
        color: var(--dim);
        line-height: 1.4;
        background: #f8fafc;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid var(--line);
      }

      .weather-form {
        margin-top: 4px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .date-field {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 500;
      }

      .date-field input {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 7px;
        font-size: 12px;
        font-family: inherit;
        color: var(--ink);
        background: #ffffff;
        outline: none;
      }

      .date-field input:focus {
        border-color: var(--weather-pin);
      }

      .preset-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 4px 0;
      }

      .preset-chip {
        background: #f1f5f9;
        border: 1px solid #cbd5e1;
        color: #334155;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 11px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.1s;
      }

      .preset-chip:hover {
        background: #e2e8f0;
        border-color: #94a3b8;
      }

      .btn-generate-plot {
        width: 100%;
        padding: 9px 12px;
        background: #0284c7;
        color: #ffffff;
        border: none;
        border-radius: 7px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: background 0.15s;
        margin-top: 4px;
      }

      .btn-generate-plot:hover {
        background: #0369a1;
      }

      .resort-weather-btn {
        width: 100%;
        padding: 7px 10px;
        background: #f0f9ff;
        border: 1px solid #bae6fd;
        color: #0284c7;
        border-radius: 7px;
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: all 0.15s;
      }

      .resort-weather-btn:hover {
        background: #e0f2fe;
        border-color: #7dd3fc;
      }

      /* Modal for displaying plot */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 3000;
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(6px);
        padding: 16px;
        overflow-y: auto;
        place-items: center;
      }

      .modal-overlay.active {
        display: grid;
      }

      .modal-card {
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        width: 100%;
        max-width: 1200px;
        display: flex;
        flex-direction: column;
        max-height: 94vh;
        border: 1px solid #cbd5e1;
        overflow: hidden;
        animation: modalIn 0.18s ease-out;
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .modal-header {
        padding: 14px 20px;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .modal-title-group h2 {
        margin: 0;
        font-size: 17px;
        color: #0f172a;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .modal-title-group p {
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--dim);
      }

      .modal-header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .modal-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 6px 12px;
        border: 1px solid var(--line);
        background: #ffffff;
        color: #334155;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.15s;
      }

      .modal-btn:hover {
        background: #f1f5f9;
        border-color: #94a3b8;
      }

      .modal-close-btn {
        background: transparent;
        border: none;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        color: var(--dim);
        padding: 2px 8px;
        border-radius: 6px;
      }

      .modal-close-btn:hover {
        color: #0f172a;
        background: #e2e8f0;
      }

      .modal-toolbar {
        padding: 10px 20px;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .toolbar-inputs {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 13px;
        font-weight: 500;
      }

      .toolbar-inputs input {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 13px;
        font-family: inherit;
        color: var(--ink);
        background: #f8fafc;
      }

      .btn-refresh {
        padding: 6px 14px;
        background: #0284c7;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .btn-refresh:hover {
        background: #0369a1;
      }

      .modal-body {
        padding: 16px;
        overflow-y: auto;
        background: #f1f5f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 420px;
        position: relative;
      }

      .modal-plot-img {
        width: 100%;
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        display: block;
      }

      .modal-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 40px 20px;
        color: #475569;
        font-weight: 500;
      }

      .spinner {
        width: 42px;
        height: 42px;
        border: 4px solid #cbd5e1;
        border-top-color: #0284c7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .modal-error {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        padding: 24px;
        border-radius: 8px;
        max-width: 500px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>🎿 Ski Vacation Options & Weather</h1>
      <p id="header-sub">
        Loading ski resorts & nearby weather stations...
      </p>
    </header>

    <div id="map"></div>

    <!-- Weather Plot Modal -->
    <div
      id="weather-modal"
      class="modal-overlay"
      onclick="onModalBackdropClick(event)"
    >
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title-group">
            <h2 id="modal-station-title">❄️ Weather Station Overview</h2>
            <p id="modal-station-sub" class="dim">Meteostat Station Data</p>
          </div>
          <div class="modal-header-actions">
            <a
              id="modal-download-btn"
              class="modal-btn"
              download="ski_weather.png"
              target="_blank"
              title="Download Image"
              >⬇ Download PNG</a
            >
            <a
              id="modal-fullscreen-btn"
              class="modal-btn"
              target="_blank"
              title="Open Full Size in New Tab"
              >↗ Full Size</a
            >
            <button
              class="modal-close-btn"
              onclick="closeWeatherModal()"
              title="Close"
            >
              &times;
            </button>
          </div>
        </div>

        <div class="modal-toolbar">
          <div class="toolbar-inputs">
            <label
              >Start:
              <input type="date" id="modal-start-date" value="2025-12-01"
            /></label>
            <label
              >End:
              <input type="date" id="modal-end-date" value="2026-01-31"
            /></label>
            <button class="btn-refresh" onclick="refreshModalPlot()">
              🔄 Update Plot
            </button>
          </div>
          <div class="preset-chips">
            <button
              type="button"
              class="preset-chip"
              onclick="setModalDates('2025-12-01', '2026-01-31')"
            >
              Dec 25 – Jan 26
            </button>
            <button
              type="button"
              class="preset-chip"
              onclick="setModalDates('2026-01-01', '2026-01-31')"
            >
              Jan 2026
            </button>
            <button
              type="button"
              class="preset-chip"
              onclick="setModalDates('2025-12-01', '2025-12-31')"
            >
              Dec 2025
            </button>
            <button
              type="button"
              class="preset-chip"
              onclick="setModalLast30Days()"
            >
              Last 30 Days
            </button>
          </div>
        </div>

        <div class="modal-body">
          <div id="modal-loader" class="modal-loader">
            <div class="spinner"></div>
            <p>
              Fetching Meteostat historical data & generating 3-panel alpine
              plot...
            </p>
          </div>

          <div id="modal-error" class="modal-error">
            <p id="modal-error-msg">
              Unable to load plot data. Please verify your selected dates.
            </p>
            <button class="modal-btn" onclick="refreshModalPlot()">
              Retry
            </button>
          </div>

          <img
            id="modal-plot-img"
            class="modal-plot-img"
            alt="Alpine Ski Weather Conditions Plot"
            style="display: none"
          />
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      // State populated dynamically from /api/places and /api/stations
      let PLACES = [];
      let STATIONS = [];

      /* -------------------------------------------------------
         MAP INITIALIZATION
         ------------------------------------------------------- */
      const map = L.map("map", {
        scrollWheelZoom: true,
      });

      map.zoomControl.setPosition("bottomleft");

      /* -------------------------------------------------------
         BASE MAPS & OVERLAYS
         ------------------------------------------------------- */
      const base = {
        OpenStreetMap: L.tileLayer(
          "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19,
          },
        ).addTo(map),

        "Terrain (OpenTopoMap)": L.tileLayer(
          "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
          {
            attribution:
              '&copy; OpenStreetMap, SRTM | &copy; <a href="https://opentopomap.org">OpenTopoMap</a>',
            maxZoom: 17,
          },
        ),
      };

      const pistes = L.tileLayer(
        "https://tiles.opensnowmap.org/pistes/{z}/{x}/{y}.png",
        {
          attribution:
            '&copy; <a href="https://www.opensnowmap.org">OpenSnowMap</a>',
          maxZoom: 18,
          opacity: 0.9,
        },
      ).addTo(map);

      const resortLayer = L.layerGroup().addTo(map);
      const weatherLayer = L.layerGroup().addTo(map);

      L.control
        .layers(
          base,
          {
            "Pistes & lifts": pistes,
            "⛷️ Ski Resorts": resortLayer,
            "❄️ Weather Stations": weatherLayer,
          },
          {
            collapsed: false,
          },
        )
        .addTo(map);

      /* -------------------------------------------------------
         POPUP HELPERS
         ------------------------------------------------------- */
      const link = (item) => {
        if (!item.url) return `<span>${item.label}</span>`;
        return `<a href="${item.url}" target="_blank" rel="noopener">${item.label} ↗</a>`;
      };

      const directionsLink = (option) => {
        const [lat, lng] = option.coords;
        const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
        return `<a class="directions" href="${url}" target="_blank" rel="noopener">🚗 Get directions in Google Maps ↗</a>`;
      };

      function getClosestStation(coords) {
        if (!STATIONS.length) return null;
        let closest = STATIONS[0];
        let minD = Infinity;
        for (const st of STATIONS) {
          const d = Math.hypot(st.coords[0] - coords[0], st.coords[1] - coords[1]);
          if (d < minD) {
            minD = d;
            closest = st;
          }
        }
        return closest;
      }

      // Skier Resort Popup
      const resortPopup = (option) => {
        const station = getClosestStation(option.coords);
        const weatherBtnHtml = station
          ? `
          <div class="row" style="margin-top: 4px;">
            <button type="button" class="resort-weather-btn" onclick="openWeatherModal('${station.id}', '${station.name}', [${station.coords}], '2025-12-01', '2026-01-31')">
              ❄️ View Weather Plot (${station.name})
            </button>
          </div>
        `
          : "";

        const itemsHtml = (option.items || [])
          .map(
            (item) => `
          <div class="row">
            ${link(item)}
            <span class="price">${item.price ? item.price + " €" : ""}</span>
          </div>
        `,
          )
          .join("");

        return `
          <p class="p-name">${option.name}</p>
          <p class="p-note">${option.note || ""}</p>
          
          ${itemsHtml}
          
          <div class="row">
            ${directionsLink(option)}
          </div>

          ${weatherBtnHtml}

          <div class="total">
            <span>Cheapest total / person</span>
            <span class="price">~${option.total} €</span>
          </div>
        `;
      };

      // Weather Station Popup
      const weatherPopup = (st) => {
        const servesList = (st.serves || []).slice(0, 5).join(", ");
        return `
          <div class="weather-popup">
            <span class="weather-tag">METEOSTAT STATION</span>
            <p class="p-name">❄️ ${st.name}</p>
            <p class="p-note">Elevation: ${st.elevation ? st.elevation + " m" : "N/A"} • ID: ${st.id}</p>
            
            <div class="resorts-served">
              <strong>Near resorts:</strong><br/>
              ${servesList || "Alpine Region"}
            </div>

            <div class="weather-form">
              <div class="date-field">
                <label for="w-start-${st.id}">Start Datum:</label>
                <input type="date" id="w-start-${st.id}" value="2025-12-01" />
              </div>
              <div class="date-field">
                <label for="w-end-${st.id}">End Datum:</label>
                <input type="date" id="w-end-${st.id}" value="2026-01-31" />
              </div>

              <div class="preset-chips">
                <button type="button" class="preset-chip" onclick="setWeatherDates('${st.id}', '2025-12-01', '2026-01-31')">Dec 25 – Jan 26</button>
                <button type="button" class="preset-chip" onclick="setWeatherDates('${st.id}', '2026-01-01', '2026-01-31')">Jan 2026</button>
                <button type="button" class="preset-chip" onclick="setWeatherDates('${st.id}', '2025-12-01', '2025-12-31')">Dec 2025</button>
                <button type="button" class="preset-chip" onclick="setLast30Days('${st.id}')">Last 30 Days</button>
              </div>

              <button type="button" class="btn-generate-plot" onclick="submitWeatherPlot('${st.id}')">
                📊 Plot Ski Conditions
              </button>
            </div>
          </div>
        `;
      };

      /* -------------------------------------------------------
         DYNAMIC MARKER RENDERING
         ------------------------------------------------------- */
      const S = 44;

      function renderMarkers(places, stations) {
        resortLayer.clearLayers();
        weatherLayer.clearLayers();

        // 1. Render Skier Resort Pins (⛷️)
        const skiMarkers = places.map((option) =>
          L.marker(option.coords, {
            icon: L.divIcon({
              className: "",
              iconSize: [S, S],
              iconAnchor: [S / 2, S / 2],
              popupAnchor: [0, -S / 2 - 2],
              html: `
                <div class="pin">
                  ⛷️
                  <span class="cap">${option.total}€</span>
                </div>
              `,
            }),
            title: option.name,
          })
            .bindPopup(resortPopup(option))
            .addTo(resortLayer),
        );

        // 2. Render Weather Station Pins (❄️ at actual station coords)
        const weatherMarkers = stations.map((st) =>
          L.marker(st.coords, {
            icon: L.divIcon({
              className: "",
              iconSize: [S, S],
              iconAnchor: [S / 2, S / 2],
              popupAnchor: [0, -S / 2 - 2],
              html: `
                <div class="pin-weather">
                  ❄️
                  <span class="cap-weather">${st.elevation ? st.elevation + "m" : "Weather"}</span>
                </div>
              `,
            }),
            title: `${st.name} Weather Station`,
          })
            .bindPopup(weatherPopup(st))
            .addTo(weatherLayer),
        );

        // Fit map bounds to show all markers
        const allMarkers = skiMarkers.concat(weatherMarkers);
        if (allMarkers.length > 0) {
          map.fitBounds(L.featureGroup(allMarkers).getBounds().pad(0.18));
        }
      }

      /* -------------------------------------------------------
         FETCH DATA FROM BACKEND ON LOAD
         ------------------------------------------------------- */
      async function loadMapData() {
        const headerSub = document.getElementById("header-sub");
        try {
          const [placesResp, stationsResp] = await Promise.all([
            fetch("/api/places").then((r) => r.json()),
            fetch("/api/stations").then((r) => r.json()),
          ]);

          PLACES = placesResp.places || [];
          STATIONS = stationsResp.stations || [];
          const distLimit = stationsResp.station_distance_km || 50;

          renderMarkers(PLACES, STATIONS);

          headerSub.innerText = `Click ⛷️ for ${PLACES.length} resort options • Click ❄️ for ${STATIONS.length} weather stations within ${distLimit}km`;
        } catch (err) {
          console.error("Error loading places or stations:", err);
          headerSub.innerText =
            "Failed to load places/stations from backend. Ensure 'python3 server.py' is running.";
        }
      }

      // Load upon page start
      loadMapData();

      /* -------------------------------------------------------
         WEATHER MODAL & PLOT CONTROLLER
         ------------------------------------------------------- */
      let currentModalStation = null;

      function setWeatherDates(stId, start, end) {
        const s = document.getElementById(`w-start-${stId}`);
        const e = document.getElementById(`w-end-${stId}`);
        if (s && e) {
          s.value = start;
          e.value = end;
        }
      }

      function setLast30Days(stId) {
        const end = new Date();
        const start = new Date();
        start.setDate(end.getDate() - 30);
        setWeatherDates(
          stId,
          start.toISOString().split("T")[0],
          end.toISOString().split("T")[0],
        );
      }

      function submitWeatherPlot(stId) {
        const st = STATIONS.find((s) => s.id === stId);
        if (!st) return;
        const sVal =
          document.getElementById(`w-start-${stId}`)?.value || "2025-12-01";
        const eVal =
          document.getElementById(`w-end-${stId}`)?.value || "2026-01-31";
        openWeatherModal(st.id, st.name, st.coords, sVal, eVal);
      }

      function openWeatherModal(stationId, stationName, coords, start, end) {
        currentModalStation = {
          id: stationId,
          name: stationName,
          coords: coords,
        };

        const modal = document.getElementById("weather-modal");
        const title = document.getElementById("modal-station-title");
        const sub = document.getElementById("modal-station-sub");
        const sInput = document.getElementById("modal-start-date");
        const eInput = document.getElementById("modal-end-date");

        title.innerHTML = `❄️ ${stationName} — Weather Overview`;
        sub.innerText = `Meteostat Station ID: ${stationId} • Coords: ${coords[0].toFixed(4)}°N, ${coords[1].toFixed(4)}°E`;
        sInput.value = start;
        eInput.value = end;

        modal.classList.add("active");
        document.body.style.overflow = "hidden";

        loadModalPlotImage();
      }

      function closeWeatherModal() {
        const modal = document.getElementById("weather-modal");
        modal.classList.remove("active");
        document.body.style.overflow = "";
      }

      function onModalBackdropClick(e) {
        if (e.target.id === "weather-modal") {
          closeWeatherModal();
        }
      }

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeWeatherModal();
        }
      });

      function setModalDates(start, end) {
        document.getElementById("modal-start-date").value = start;
        document.getElementById("modal-end-date").value = end;
        loadModalPlotImage();
      }

      function setModalLast30Days() {
        const end = new Date();
        const start = new Date();
        start.setDate(end.getDate() - 30);
        setModalDates(
          start.toISOString().split("T")[0],
          end.toISOString().split("T")[0],
        );
      }

      function refreshModalPlot() {
        loadModalPlotImage();
      }

      function loadModalPlotImage() {
        if (!currentModalStation) return;

        const loader = document.getElementById("modal-loader");
        const errorBox = document.getElementById("modal-error");
        const errorMsg = document.getElementById("modal-error-msg");
        const img = document.getElementById("modal-plot-img");
        const downloadBtn = document.getElementById("modal-download-btn");
        const fullBtn = document.getElementById("modal-fullscreen-btn");

        const start = document.getElementById("modal-start-date").value;
        const end = document.getElementById("modal-end-date").value;

        if (!start || !end) {
          errorMsg.innerText = "Please select both start and end dates.";
          errorBox.style.display = "flex";
          loader.style.display = "none";
          img.style.display = "none";
          return;
        }

        if (start > end) {
          errorMsg.innerText = "Start date must be before end date.";
          errorBox.style.display = "flex";
          loader.style.display = "none";
          img.style.display = "none";
          return;
        }

        loader.style.display = "flex";
        errorBox.style.display = "none";
        img.style.display = "none";

        const plotUrl = `/api/plot?station=${encodeURIComponent(currentModalStation.id)}&lat=${currentModalStation.coords[0]}&lon=${currentModalStation.coords[1]}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&name=${encodeURIComponent(currentModalStation.name)}`;

        downloadBtn.href = plotUrl;
        fullBtn.href = plotUrl;

        // Preload image
        const newImg = new Image();
        newImg.onload = () => {
          img.src = plotUrl;
          img.style.display = "block";
          loader.style.display = "none";
        };
        newImg.onerror = async () => {
          loader.style.display = "none";
          img.style.display = "none";
          errorBox.style.display = "flex";

          try {
            const resp = await fetch(plotUrl);
            const errJson = await resp.json();
            errorMsg.innerText =
              errJson.error ||
              "Failed to generate plot. Please try a different date range.";
          } catch (e) {
            errorMsg.innerText =
              "Could not connect to the weather plot backend. Ensure 'python3 server.py' is running.";
          }
        };
        newImg.src = plotUrl;
      }
    </script>
  </body>
</html>
